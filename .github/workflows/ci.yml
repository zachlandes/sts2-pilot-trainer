name: CI

# Covers the parts of the arbiter that build without the licensed game assemblies:
# the manifest/evidence domain, the vendored Godot stubs, and the bootstrap tool.
# The replay proof itself - engine reconstruction, map topology, determinism and the
# negative controls - needs a local Slay the Spire 2 install and cannot run here.
# See docs/dependencies.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  domain:
    name: Domain layer (no game assemblies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore sts2-pilot-trainer.domain.slnf

      - name: Build
        run: dotnet build sts2-pilot-trainer.domain.slnf -c Release --no-restore --nologo

      # Through test-session.sh, because `dotnet test` prints "Passed!" with a partial
      # total for a session it aborted and a green tick here would say the same. The
      # script's verdict comes from whether the session completed.
      - name: Test
        run: ./scripts/test-session.sh sts2-pilot-trainer.domain.slnf -c Release --no-build --nologo --verbosity normal

      # The step above reports success while skipping 141 of Arbiter.Tests' 217 tests,
      # because this runner has no game. This one asserts that the skipped set is the
      # one recorded in scripts/expected-hosted-skips.txt, so a test moved behind
      # [GameFact], deleted or swapped cannot change what CI covers while leaving it
      # green. Structural drift only - a test already skipped here and broken inside
      # is the local gate's job.
      - name: Assert the expected skips
        run: ./scripts/assert-expected-skips.sh

      # docs/manifest-format.md is generated from the validator's per-verb argument
      # rules and the engine-command table. This regenerates it and fails when the
      # committed copy is not what those declarations produce, so the one document
      # that describes the format cannot quietly stop describing it.
      - name: Assert the format reference
        run: ./scripts/format-reference.sh --check

      - name: Format
        run: dotnet format sts2-pilot-trainer.domain.slnf --verify-no-changes --verbosity minimal
